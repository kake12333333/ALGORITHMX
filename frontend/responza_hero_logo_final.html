<!DOCTYPE html>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;}
body{background:transparent;overflow:hidden;}
.wrap{display:flex;justify-content:center;align-items:center;width:min(620px,100%);height:min(660px,100%);padding:10px 0;background:transparent;}

/* Globe spin */
@keyframes spinLand{from{transform:translateX(0)}to{transform:translateX(-560px)}}
@keyframes spinCloud{from{transform:translateX(0)}to{transform:translateX(-560px)}}

/* Heartbeat */
@keyframes hbSweep{
  0%{stroke-dashoffset:520;opacity:0}
  8%{opacity:1}
  58%{opacity:1}
  80%{stroke-dashoffset:0;opacity:0}
  100%{stroke-dashoffset:0;opacity:0}
}

/* SOS pulse rings */
@keyframes sosPulse{
  0%{r:8;opacity:.8;stroke-width:2.5}
  100%{r:45;opacity:0;stroke-width:.5}
}
@keyframes sosText{
  0%,100%{opacity:1} 50%{opacity:.2}
}

/* Aid drop */
@keyframes aidDrop{
  0%{transform:translateY(-40px);opacity:0}
  20%{opacity:1}
  80%{opacity:1}
  100%{transform:translateY(12px);opacity:0}
}

/* Person help reach */
@keyframes handReach{
  0%,100%{transform:translateY(0px) scaleY(1)}
  50%{transform:translateY(-6px) scaleY(1.08)}
}

/* Float variants */
@keyframes f0{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes f1{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
@keyframes f2{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes f3{0%,100%{transform:translateY(-2px)}50%{transform:translateY(5px)}}

/* Network pulse */
@keyframes wirePulse{0%,100%{opacity:.12}50%{opacity:.8}}

/* Ray shoot */
@keyframes rayShoot{
  0%{stroke-dashoffset:140;opacity:0}
  22%{opacity:1}
  65%{opacity:1}
  88%{stroke-dashoffset:0;opacity:0}
  100%{opacity:0}
}

/* Dot burst */
@keyframes dBurst{
  0%{opacity:0;r:3}30%{opacity:1;r:7}70%{opacity:1;r:5.5}100%{opacity:0;r:3}
}
@keyframes dRing{
  0%{r:5;opacity:.65}100%{r:28;opacity:0}
}

/* Shield glow */
@keyframes shGlow{0%,100%{opacity:.72}50%{opacity:1}}

/* Base flare */
@keyframes baseFlare{0%,100%{rx:52;opacity:.28}50%{rx:88;opacity:.62}}

/* Atmosphere breathe */
@keyframes atmoBreathe{0%,100%{opacity:.6}50%{opacity:1}}

/* Cross pulse (medical) */
@keyframes crossPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}

/* Help signal orbit */
@keyframes orbitCW{from{transform:rotate(0deg) translateX(172px) rotate(0deg)}to{transform:rotate(360deg) translateX(172px) rotate(-360deg)}}
@keyframes orbitCCW{from{transform:rotate(0deg) translateX(172px) rotate(0deg)}to{transform:rotate(-360deg) translateX(172px) rotate(360deg)}}

/* Connecting line draw */
@keyframes lineDraw{0%{stroke-dashoffset:200}100%{stroke-dashoffset:0}}

/* Dove / peace symbol float */
@keyframes doveFloat{
  0%,100%{transform:translate(0,0) rotate(-8deg)}
  33%{transform:translate(6px,-8px) rotate(4deg)}
  66%{transform:translate(-4px,-5px) rotate(-3deg)}
}

/* Alert triangle flash */
@keyframes alertFlash{0%,49%,100%{opacity:1}50%,98%{opacity:.08}}

/* Aid box bounce */
@keyframes aidBounce{
  0%{transform:translateY(0) rotate(0deg)}
  30%{transform:translateY(-18px) rotate(8deg)}
  60%{transform:translateY(-8px) rotate(-4deg)}
  80%{transform:translateY(-14px) rotate(3deg)}
  100%{transform:translateY(0) rotate(0deg)}
}

/* Ripple for help signal */
@keyframes ripple{
  0%{r:0;opacity:.7}
  100%{r:55;opacity:0}
}

/* Scroll text on banner */
@keyframes scrollBanner{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

/* Hot spot pulse */
@keyframes hotPulse{0%,100%{r:4.5;opacity:.95}50%{r:8.5;opacity:.4}}
@keyframes hotRing{0%{r:5;opacity:.6}100%{r:30;opacity:0}}

/* Data traveling dot */
@keyframes dataDot{0%{offset-distance:0%}100%{offset-distance:100%}}

/* Shake distress */
@keyframes distress{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}

</style>
