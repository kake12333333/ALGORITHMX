<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeriPulse — Access System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-deep: #020818;
    --blue-mid: #051535;
    --blue-glow: #1a6fff;
    --blue-bright: #4d9fff;
    --green-glow: #00ff9d;
    --red-alert: #ff4444;
    --yellow-warn: #ffcc44;
    --white: #e8f0ff;
    --white-dim: #8899bb;
    --card-bg: rgba(5, 21, 53, 0.7);
    --border: rgba(77, 159, 255, 0.15);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--blue-deep);
    color: var(--white);
    font-family: 'Syne', sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
  }
  #bg-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%; z-index: 0;
    pointer-events: none;
  }
  #earth-canvas {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1; pointer-events: none;
    opacity: 0.18;
    transition: opacity .5s;
  }
  .alert-ticker {
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 200; background: rgba(2,8,24,0.95);
    border-top: 1px solid rgba(255,68,68,0.3);
    padding: 10px 0; overflow: hidden;
  }
  .ticker-inner {
    display: flex; gap: 80px;
    animation: ticker 30s linear infinite;
    white-space: nowrap;
  }
  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .ticker-item {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 2px;
    color: var(--white-dim); text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .ticker-dot {
    width: 6px; height: 6px; border-radius: 50%;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }
  .ticker-dot.red { background: var(--red-alert); box-shadow: 0 0 8px var(--red-alert); }
  .ticker-dot.yellow { background: var(--yellow-warn); box-shadow: 0 0 8px var(--yellow-warn); }
  .ticker-dot.green { background: var(--green-glow); box-shadow: 0 0 8px var(--green-glow); }
  @keyframes pulse-dot {
    0%,100%{ transform: scale(1); opacity:1; }
    50%{ transform: scale(1.6); opacity:.6; }
  }

  .auth-screen {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 70px;
  }
  .auth-shell {
    width: min(520px, calc(100vw - 24px));
    background: rgba(5, 21, 53, 0.82);
    border: 1px solid rgba(77,159,255,0.3);
    box-shadow: 0 0 80px rgba(26,111,255,0.2);
    backdrop-filter: blur(16px);
    padding: 46px 42px 40px;
    position: relative;
    overflow: hidden;
    animation: modalIn .4s ease;
  }
  .auth-shell::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(140deg, rgba(26,111,255,0.08), transparent 45%, rgba(0,255,157,0.04));
    pointer-events: none;
  }
  .auth-shell::after {
    content: '';
    position: absolute;
    inset: auto -20% -40% -20%;
    height: 220px;
    background: radial-gradient(circle, rgba(26,111,255,0.18), transparent 65%);
    pointer-events: none;
    filter: blur(16px);
  }
  @keyframes modalIn {
    from { opacity:0; transform: scale(.96) translateY(20px); }
    to { opacity:1; transform: scale(1) translateY(0); }
  }
  .brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 18px;
    position: relative;
    z-index: 1;
  }
  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-logo-mark {
    width: 44px;
    height: 44px;
    flex: 0 0 44px;
    border: 0;
    background: transparent;
    display: block;
    pointer-events: none;
  }
  .back-link {
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--white-dim);
    padding: 8px 12px;
    border: 1px solid var(--border);
    transition: border-color .2s, color .2s, box-shadow .2s;
  }
  .back-link:hover {
    color: var(--white);
    border-color: var(--blue-glow);
    box-shadow: 0 0 18px rgba(26,111,255,0.18);
  }
  .modal-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
  }
  .modal-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--white-dim);
    margin-bottom: 36px;
    position: relative;
    z-index: 1;
  }
  .tab-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-bottom: 28px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    padding: 4px;
    position: relative;
    z-index: 1;
  }
  .tab-btn {
    padding: 11px;
    background: transparent; border: none; color: var(--white-dim);
    font-family: 'Syne', sans-serif; font-weight: 700;
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    
    transition: all .25s;
  }
  .tab-btn.active {
    color: var(--white);
    background: linear-gradient(135deg, rgba(26,111,255,0.22), rgba(26,111,255,0.08));
    box-shadow: inset 0 0 0 1px rgba(77,159,255,0.35), 0 0 16px rgba(26,111,255,0.22);
  }
  .auth-pane {
    position: relative;
    z-index: 1;
    opacity: 1;
    transform: translateY(0);
    transition: opacity .25s ease, transform .25s ease;
  }
  .auth-pane.fade-out {
    opacity: 0;
    transform: translateY(8px);
  }
  .form-group { margin-bottom: 18px; }
  .form-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 3px; color: var(--white-dim);
    text-transform: uppercase; display: block; margin-bottom: 8px;
  }
  .input-wrap { position: relative; }
  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(77,159,255,0.7);
    pointer-events: none;
    width: 16px;
    height: 16px;
    z-index: 1;
  }
  .form-input, .form-select {
    width: 100%; padding: 14px 16px 14px 42px;
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--border); color: var(--white);
    font-family: 'Syne', sans-serif; font-size: 14px;
    outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .form-input:focus, .form-select:focus {
    border-color: var(--blue-glow);
    background: rgba(255,255,255,0.07);
    box-shadow: 0 0 0 1px rgba(26,111,255,0.25), 0 0 22px rgba(26,111,255,0.16);
  }
  .form-select option { background: var(--blue-mid); }
  .btn-submit {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--blue-glow), #0040cc);
    border: none; color: #fff;
    font-family: 'Syne', sans-serif; font-weight: 700;
    font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
     margin-top: 8px;
    transition: box-shadow .3s, transform .2s;
    position: relative;
    z-index: 1;
  }
  .btn-submit:hover {
    box-shadow: 0 0 30px rgba(26,111,255,0.4);
    transform: translateY(-1px);
  }
  .hint {
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    line-height: 1.8;
    letter-spacing: 2px;
    color: var(--white-dim);
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }
  @media (max-width: 560px) {
    .auth-shell { padding: 38px 18px 28px; }
    .brand-row { flex-direction: column; align-items: flex-start; }
    .brand-logo-mark { width: 40px; height: 40px; flex-basis: 40px; }
  }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<canvas id="earth-canvas" width="800" height="800"></canvas>

<div class="alert-ticker">
  <div class="ticker-inner" id="ticker"></div>
</div>

<main class="auth-screen">
  <section class="auth-shell" aria-label="Authentication">
    <div class="brand-row">
      <div class="brand"><iframe class="brand-logo-mark" src="responza_hero_logo_final.html" title="VeriPulse Logo" loading="lazy"></iframe>VeriPulse</div>
      <a class="back-link" href="veripulse.html">Back to landing</a>
    </div>
    <div class="modal-title">ENTER SYSTEM</div>
    <div class="modal-sub">VERIPULSE ACCESS PORTAL</div>

    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('login',this)">LOGIN</button>
      <button class="tab-btn" onclick="switchTab('register',this)">SIGNUP</button>
    </div>

    <div id="login-form" class="auth-pane">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16v12H4V6Z" stroke="currentColor" stroke-width="1.8"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <input class="form-input" type="email" placeholder="you@veripulse.io" id="login-email">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <input class="form-input" type="password" placeholder="••••••••" id="login-pass">
        </div>
      </div>
      <button class="btn-submit" onclick="doLogin()">AUTHENTICATE →</button>
    </div>

    <div id="register-form" class="auth-pane" style="display:none">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <input class="form-input" type="text" placeholder="Your Full Name" id="reg-name">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16v12H4V6Z" stroke="currentColor" stroke-width="1.8"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <input class="form-input" type="email" placeholder="you@veripulse.io" id="reg-email">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <input class="form-input" type="password" placeholder="Create a strong password" id="reg-pass">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.8"/></svg>
          </span>
          <input class="form-input" type="password" placeholder="Confirm password" id="reg-confirm-pass">
        </div>
      </div>
      <button class="btn-submit" onclick="doRegister()">CREATE ACCOUNT →</button>
    </div>

    
  </section>
</main>

<script>
const bgC = document.getElementById('bg-canvas');
const bgCtx = bgC.getContext('2d');
bgC.width = window.innerWidth; bgC.height = window.innerHeight;
window.addEventListener('resize',()=>{ bgC.width=window.innerWidth; bgC.height=window.innerHeight; });

const particles = Array.from({length:120},()=>({
  x: Math.random()*window.innerWidth,
  y: Math.random()*window.innerHeight,
  r: Math.random()*.8+.2,
  vx: (Math.random()-.5)*.3,
  vy: (Math.random()-.5)*.3,
  a: Math.random()
}));

function drawBg(){
  bgCtx.fillStyle='rgba(2,8,24,0.13)';
  bgCtx.fillRect(0,0,bgC.width,bgC.height);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=bgC.width; if(p.x>bgC.width)p.x=0;
    if(p.y<0)p.y=bgC.height; if(p.y>bgC.height)p.y=0;
    p.a=Math.abs(Math.sin(Date.now()/3000+p.x));
    bgCtx.beginPath();
    bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    bgCtx.fillStyle=`rgba(77,159,255,${p.a*0.68})`;
    bgCtx.fill();
  });
  const t=Date.now()/8000;
  [[.2,.3,'#1a6fff',190],[.7,.6,'#00ff9d',130],[.5,.8,'#ff4444',90]].forEach(([cx,cy,col,r])=>{
    const gx=bgC.width*(cx+Math.sin(t)*0.04);
    const gy=bgC.height*(cy+Math.cos(t)*0.04);
    const g=bgCtx.createRadialGradient(gx,gy,0,gx,gy,r);
    g.addColorStop(0,col+'2a'); g.addColorStop(1,'transparent');
    bgCtx.fillStyle=g; bgCtx.fillRect(0,0,bgC.width,bgC.height);
  });
  const depth=bgCtx.createRadialGradient(bgC.width*0.5,bgC.height*0.45,20,bgC.width*0.5,bgC.height*0.45,bgC.height*0.8);
  depth.addColorStop(0,'rgba(26,111,255,0.05)');
  depth.addColorStop(1,'transparent');
  bgCtx.fillStyle=depth;
  bgCtx.fillRect(0,0,bgC.width,bgC.height);
  requestAnimationFrame(drawBg);
}
drawBg();

const ec = document.getElementById('earth-canvas');
const ectx = ec.getContext('2d');
const CX=400, CY=400, R=300;
let earthRot=0;
function drawEarth(){
  ectx.clearRect(0,0,800,800);
  earthRot+=0.002;
  const sg=ectx.createRadialGradient(350,320,20,CX,CY,R);
  sg.addColorStop(0,'#0a2a6e');
  sg.addColorStop(.5,'#051535');
  sg.addColorStop(1,'#020818');
  ectx.beginPath(); ectx.arc(CX,CY,R,0,Math.PI*2);
  ectx.fillStyle=sg; ectx.fill();
  ectx.save(); ectx.beginPath(); ectx.arc(CX,CY,R,0,Math.PI*2); ectx.clip();
  ectx.globalAlpha=0.4;
  ectx.strokeStyle='rgba(26,111,255,0.08)'; ectx.lineWidth=0.5;
  for(let i=0;i<18;i++){
    const angle=i/18*Math.PI*2+earthRot;
    ectx.beginPath();
    ectx.ellipse(CX,CY,R*Math.abs(Math.cos(angle)),R,angle,0,Math.PI*2);
    ectx.stroke();
  }
  ectx.restore();
  const ring=ectx.createRadialGradient(CX,CY,R-10,CX,CY,R+40);
  ring.addColorStop(0,'rgba(26,111,255,0.25)');
  ring.addColorStop(.5,'rgba(0,255,157,0.1)');
  ring.addColorStop(1,'transparent');
  ectx.beginPath(); ectx.arc(CX,CY,R+40,0,Math.PI*2);
  ectx.fillStyle=ring; ectx.fill();
  requestAnimationFrame(drawEarth);
}
drawEarth();

const tickerData=[
  {col:'red',text:'HIGH ALERT — Structure fire reported in Andheri West'},
  {col:'yellow',text:'MEDIUM — Flood watch active in Bandra East'},
  {col:'green',text:'RESOLVED — Power outage fixed in Dadar'},
  {col:'red',text:'HIGH ALERT — Building collapse risk in Kurla'},
  {col:'yellow',text:'MEDIUM — Traffic incident on Western Express Hwy'},
  {col:'green',text:'RESOLVED — Medical emergency handled in Colaba'},
];
function buildTicker(){
  const t=document.getElementById('ticker');
  const items=[...tickerData,...tickerData].map(d=>`
    <span class="ticker-item">
      <span class="ticker-dot ${d.col}"></span>
      ${d.text}
    </span>
  `).join('');
  t.innerHTML=items;
}
buildTicker();

function switchTab(tab,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const loginForm=document.getElementById('login-form');
  const registerForm=document.getElementById('register-form');
  const activePane=tab==='login'?registerForm:loginForm;
  const nextPane=tab==='login'?loginForm:registerForm;
  activePane.classList.add('fade-out');
  setTimeout(()=>{
    activePane.style.display='none';
    nextPane.style.display='block';
    nextPane.classList.add('fade-out');
    requestAnimationFrame(()=>nextPane.classList.remove('fade-out'));
  },170);
}
function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!email||!pass){alert('Please fill in all fields');return;}
  window.location.href='citizen.html';
}
function doRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const pass=document.getElementById('reg-pass').value;
  const confirmPass=document.getElementById('reg-confirm-pass').value;
  if(!name||!email||!pass){alert('Please fill in all fields');return;}
  if(pass!==confirmPass){alert('Passwords do not match');return;}
  window.location.href='citizen.html';
}
</script>
</body>
</html>
