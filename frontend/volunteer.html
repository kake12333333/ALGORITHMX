<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeriPulse — Volunteer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="citizen.css">
<link rel="stylesheet" href="volunteer.css">
</head>
<body>
<!-- THIS IS VOLUNTEER PAGE -->
<canvas id="bg-canvas"></canvas>
<canvas id="earth-canvas" width="800" height="800"></canvas>
<div class="alert-ticker"><div class="ticker-inner" id="ticker"></div></div>
<!-- SIDEBAR SECTION -->
<aside class="vp-sidebar">
  <a class="vp-sidebar-brand" href="veripulse.html"><iframe class="vp-sidebar-logo" src="responza_hero_logo_final.html" title="VeriPulse Logo" loading="lazy"></iframe>VeriPulse</a>
  <div class="vp-side-menu">
    <a class="vp-side-link" href="citizen.html"><span class="icon">⌂</span>Home</a>
    <a class="vp-side-link" href="dashboard.html"><span class="icon">▣</span>Dashboard</a>
    <a class="vp-side-link" href="report.html"><span class="icon">⚠</span>Report Emergency</a>
    <a class="vp-side-link active" href="volunteer.html"><span class="icon">✦</span>Join as Volunteer</a>
    <a class="vp-side-link" href="chat.html"><span class="icon">◌</span>Chat</a>
  </div>
  <div class="vp-sidebar-footer">Citizen system • live response</div>
</aside>

<div class="vp-page">
  <div class="vp-page-topbar">
    <a class="vp-logout" href="veripulse.html">Logout</a>
  </div>
  <!-- MAIN CONTENT SECTION -->
  <main class="vp-page-inner vp-page-enter">
    <section class="vp-section vp-volunteer-section">
    <div class="vp-section-header">
      <div class="vp-section-tag">// Volunteer Network</div>
      <h1 class="vp-section-title">JOIN AS VOLUNTEER</h1>
    </div>
    <!-- VOLUNTEER FORM SECTION -->
    <div class="vp-form vp-form-shell vp-volunteer-shell">
      <div class="vp-form-grid">
        <div>
          <label class="vp-form-label">Name</label>
          <input class="vp-input" type="text" placeholder="Your name">
        </div>
        <div>
          <label class="vp-form-label">Age</label>
          <input class="vp-input" type="number" placeholder="Your age">
        </div>
        <div>
          <label class="vp-form-label">ID Upload</label>
          <label class="vp-upload">
            <span class="vp-upload-label">Upload Aadhar / ID</span>
            <input type="file" accept="image/*,.pdf">
            <span class="vp-upload-button">Choose File</span>
          </label>
        </div>
        <div>
          <label class="vp-form-label">Skills</label>
          <input class="vp-input" type="text" placeholder="Medical, rescue, fire, logistics...">
        </div>
        <div>
          <label class="vp-form-label">Reason to Help</label>
          <textarea class="vp-textarea" placeholder="Tell us why you want to join..."></textarea>
        </div>
      </div>
      <button class="vp-form-submit vp-volunteer-join" id="join-btn">Join</button>
      <div class="vp-volunteer-state" id="volunteer-state">You are now a Volunteer</div>
    </div>
    </section>
  </main>
</div>

<!-- SUCCESS MODAL POPUP -->
<div class="vp-modal-overlay" id="successModal">
  <div class="vp-modal-content">
    <div class="vp-modal-icon">✓</div>
    <h2 class="vp-modal-title">Volunteer Registration Submitted Successfully</h2>
    <p class="vp-modal-status">Status: <span class="vp-status-pending">Pending Approval</span></p>
    <button class="vp-modal-button" id="dashboardBtn">Go to Dashboard</button>
  </div>
</div>

<script src="citizen-ui.js"></script>
<script>
  // THIS IS VOLUNTEER PAGE SCRIPT
  // HANDLE VOLUNTEER FORM SUBMISSION STATE
  const joinBtn = document.getElementById('join-btn');
  const volunteerState = document.getElementById('volunteer-state');
  const successModal = document.getElementById('successModal');
  const dashboardBtn = document.getElementById('dashboardBtn');

  // Show modal instead of state text
  joinBtn.addEventListener('click', () => {
    // Show the success modal
    successModal.classList.add('active');
    joinBtn.style.display = 'none';
    volunteerState.style.display = 'none';
    document.body.classList.add('no-y-overflow');
  });

  // Redirect to volunteer dashboard on button click
  dashboardBtn.addEventListener('click', () => {
    window.location.href = 'volunteer-dashboard.html';
  });
</script>
</body>
</html>
