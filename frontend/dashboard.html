<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VeriPulse — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="citizen.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<!-- EXISTING DASHBOARD PAGE -->
<canvas id="bg-canvas"></canvas>
<canvas id="earth-canvas" width="800" height="800"></canvas>
<div class="alert-ticker"><div class="ticker-inner" id="ticker"></div></div>
<!-- SIDEBAR SECTION -->
<aside class="vp-sidebar">
  <a class="vp-sidebar-brand" href="veripulse.html"><iframe class="vp-sidebar-logo" src="responza_hero_logo_final.html" title="VeriPulse Logo" loading="lazy"></iframe>VeriPulse</a>
  <div class="vp-side-menu">
    <a class="vp-side-link" href="citizen.html"><span class="icon">⌂</span>Home</a>
    <a class="vp-side-link active" href="dashboard.html"><span class="icon">▣</span>Dashboard</a>
    <a class="vp-side-link" href="report.html"><span class="icon">⚠</span>Report Emergency</a>
    <a class="vp-side-link" href="volunteer.html"><span class="icon">✦</span>Join as Volunteer</a>
    <a class="vp-side-link" href="chat.html"><span class="icon">◌</span>Chat</a>
  </div>
  <div class="vp-sidebar-footer">Citizen system • live response</div>
</aside>

<div class="vp-page">
  <div class="vp-page-topbar">
    <a class="vp-logout" href="veripulse.html">Logout</a>
  </div>
  <!-- MAIN CONTENT SECTION -->
  <main class="vp-page-inner vp-page-enter">
    <section class="vp-section vp-dashboard-section">
    <!-- DASHBOARD TOP SECTION -->
    <header class="vp-dashboard-top">
      <div>
        <div class="vp-section-tag">// Citizen Dashboard</div>
        <h1 class="vp-dashboard-title">Live Dashboard</h1>
      </div>
      <div class="vp-dashboard-top-actions">
        <div class="vp-live-indicator"><span class="dot"></span>Live</div>
        <button class="vp-dashboard-report-btn">+ Report</button>
      </div>
    </header>

    <!-- SUMMARY CARD SECTION -->
    <div class="vp-summary-grid">
      <article class="vp-summary-card">
        <div class="vp-summary-icon blue">◉</div>
        <div class="vp-summary-meta">
          <div class="vp-summary-label">Total Alerts</div>
          <div class="vp-summary-value" id="summary-total">0</div>
        </div>
      </article>
      <article class="vp-summary-card">
        <div class="vp-summary-icon green">◉</div>
        <div class="vp-summary-meta">
          <div class="vp-summary-label">Verified</div>
          <div class="vp-summary-value" id="summary-verified">0</div>
        </div>
      </article>
      <article class="vp-summary-card">
        <div class="vp-summary-icon red">◉</div>
        <div class="vp-summary-meta">
          <div class="vp-summary-label">High Priority</div>
          <div class="vp-summary-value" id="summary-high">0</div>
        </div>
      </article>
      <article class="vp-summary-card">
        <div class="vp-summary-icon yellow">◉</div>
        <div class="vp-summary-meta">
          <div class="vp-summary-label">Suspicious</div>
          <div class="vp-summary-value" id="summary-suspicious">0</div>
        </div>
      </article>
    </div>

    <!-- FILTER SECTION -->
    <div class="vp-filter-tabs" role="tablist" aria-label="Incident filters">
      <button class="vp-filter-tab active" type="button" data-filter="verified">Verified (0)</button>
      <button class="vp-filter-tab" type="button" data-filter="high">High Priority (0)</button>
      <button class="vp-filter-tab" type="button" data-filter="suspicious">Suspicious (0)</button>
      <button class="vp-filter-tab" type="button" data-filter="all">All (0)</button>
    </div>

    <!-- INCIDENT LIST SECTION -->
    <div class="vp-dashboard-list" id="dashboard-list"></div>

    <div class="vp-dashboard-modal" id="dashboard-help-modal" aria-hidden="true">
      <div class="vp-dashboard-modal-card vp-form-shell">
        <div class="vp-upload-label">Support Request Sent</div>
        <div class="vp-dashboard-modal-copy" id="dashboard-help-text"></div>
        <button class="vp-action-help" type="button" id="dashboard-help-close">Close</button>
      </div>
    </div>
    </section>
  </main>
</div>
<script src="citizen-ui.js"></script>
<script>
  const dashboardState = {
    selectedFilter: 'all',
    incidents: [
      { id: 'ALT-001', userName: 'Riya Kapoor', title: 'Cardiac arrest reported at metro station', location: 'Andheri West, Mumbai', time: '2 min ago', trustScore: 92, verificationStatus: 'Verified', priorityLevel: 'High' },
      { id: 'ALT-002', userName: 'Aarav Singh', title: 'Building fire on 3rd floor, people trapped', location: 'Bandra East, Mumbai', time: '5 min ago', trustScore: 88, verificationStatus: 'Verified', priorityLevel: 'High' },
      { id: 'ALT-003', userName: 'Neha Sharma', title: 'Flooding reported in low-lying area', location: 'Kurla, Mumbai', time: '8 min ago', trustScore: 76, verificationStatus: 'Verified', priorityLevel: 'Medium' },
      { id: 'ALT-004', userName: 'Kabir Patel', title: 'Suspicious smoke reported near school campus', location: 'Thane West, Mumbai', time: '12 min ago', trustScore: 53, verificationStatus: 'Suspicious', priorityLevel: 'Medium' },
      { id: 'ALT-005', userName: 'Isha Verma', title: 'Gas leak complaint in residential block', location: 'Powai, Mumbai', time: '14 min ago', trustScore: 69, verificationStatus: 'Verified', priorityLevel: 'High' },
      { id: 'ALT-006', userName: 'Manav Desai', title: 'Road accident with injured commuter', location: 'Sion Circle, Mumbai', time: '16 min ago', trustScore: 84, verificationStatus: 'Verified', priorityLevel: 'High' },
      { id: 'ALT-007', userName: 'Sanya Nair', title: 'Unverified crowd panic near local station', location: 'Dadar, Mumbai', time: '18 min ago', trustScore: 47, verificationStatus: 'Suspicious', priorityLevel: 'Low' }
    ]
  };

  const dashboardList = document.getElementById('dashboard-list');
  const filterTabs = Array.from(document.querySelectorAll('.vp-filter-tab'));
  const helpModal = document.getElementById('dashboard-help-modal');
  const helpText = document.getElementById('dashboard-help-text');
  const helpClose = document.getElementById('dashboard-help-close');

  function getFilteredIncidents() {
    const active = dashboardState.selectedFilter;
    const source = dashboardState.incidents;
    if (active === 'verified') return source.filter(item => item.verificationStatus.toLowerCase() === 'verified');
    if (active === 'high') return source.filter(item => item.priorityLevel.toLowerCase() === 'high');
    if (active === 'suspicious') return source.filter(item => item.verificationStatus.toLowerCase() === 'suspicious');
    return source;
  }

  function getPriorityClass(priorityLevel) {
    const p = priorityLevel.toLowerCase();
    if (p === 'high') return 'high';
    if (p === 'medium') return 'medium';
    return 'low';
  }

  function getFilterCounts() {
    const source = dashboardState.incidents;
    return {
      all: source.length,
      verified: source.filter(item => item.verificationStatus.toLowerCase() === 'verified').length,
      high: source.filter(item => item.priorityLevel.toLowerCase() === 'high').length,
      suspicious: source.filter(item => item.verificationStatus.toLowerCase() === 'suspicious').length
    };
  }

  function updateTabs() {
    const counts = getFilterCounts();
    filterTabs.forEach((tab) => {
      const key = tab.dataset.filter;
      const text = key === 'high' ? 'High Priority' : key.charAt(0).toUpperCase() + key.slice(1);
      tab.textContent = `${text} (${counts[key] || 0})`;
      tab.classList.toggle('active', key === dashboardState.selectedFilter);
    });
  }

  function updateSummary(filteredIncidents) {
    const total = filteredIncidents.length;
    const verified = filteredIncidents.filter(item => item.verificationStatus.toLowerCase() === 'verified').length;
    const highPriority = filteredIncidents.filter(item => item.priorityLevel.toLowerCase() === 'high').length;
    const suspicious = filteredIncidents.filter(item => item.verificationStatus.toLowerCase() === 'suspicious').length;

    document.getElementById('summary-total').textContent = String(total);
    document.getElementById('summary-verified').textContent = String(verified);
    document.getElementById('summary-high').textContent = String(highPriority);
    document.getElementById('summary-suspicious').textContent = String(suspicious);
  }

  function renderIncidentCard(incident) {
    const priorityClass = getPriorityClass(incident.priorityLevel);

    return `
      <article class="vp-alert-card-shell" data-id="${incident.id}">
        <div class="vp-alert-left">
          <div class="vp-alert-reporter">Reported by <span class="vp-reporter-name">${incident.userName}</span></div>
          <h2 class="vp-alert-title">${incident.title}</h2>
          <div class="vp-alert-location">${incident.location}</div>
          <div class="vp-alert-time"><span class="vp-time-icon" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><circle cx="10" cy="10" r="7.2"></circle><path d="M10 5.8v4.4l2.9 1.6"></path></svg></span>${incident.time}</div>
        </div>
        <div class="vp-alert-right">
          <div class="vp-alert-stats">
            <div class="vp-stat-group">
              <span class="vp-stat-label">Trust Score</span>
              <span class="vp-stat-value">${incident.trustScore}%</span>
            </div>
            <div class="vp-stat-group">
              <span class="vp-stat-label">Priority</span>
              <span class="vp-stat-value priority-${priorityClass}">${incident.priorityLevel}</span>
            </div>
            <div class="vp-stat-group">
              <span class="vp-stat-label">Status</span>
              <span class="vp-stat-value status-${incident.verificationStatus.toLowerCase()}">${incident.verificationStatus}</span>
            </div>
          </div>
        </div>
      </article>
    `;
  }

  function renderDashboard() {
    const filtered = getFilteredIncidents();
    updateTabs();
    updateSummary(filtered);

    if (!filtered.length) {
      dashboardList.innerHTML = '<div class="vp-dashboard-empty">No incidents found for this filter.</div>';
      return;
    }

    dashboardList.innerHTML = filtered.map(renderIncidentCard).join('');
  }

  function openHelpModal(incidentId) {
    const incident = dashboardState.incidents.find(item => item.id === incidentId);
    if (!incident) return;
    helpText.textContent = `Help escalation queued for ${incident.id} at ${incident.location}.`;
    helpModal.classList.add('active');
    helpModal.setAttribute('aria-hidden', 'false');
  }

  function closeHelpModal() {
    helpModal.classList.remove('active');
    helpModal.setAttribute('aria-hidden', 'true');
  }

  const reportBtn = document.querySelector('.vp-dashboard-report-btn');

  filterTabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      const nextFilter = tab.dataset.filter;
      if (!nextFilter) return;
      dashboardState.selectedFilter = nextFilter;
      renderDashboard();
    });
  });

  if (reportBtn) {
    reportBtn.addEventListener('click', () => {
      window.location.href = 'report.html';
    });
  }

  helpClose.addEventListener('click', closeHelpModal);
  helpModal.addEventListener('click', (event) => {
    if (event.target === helpModal) closeHelpModal();
  });

  renderDashboard();
</script>
</body>
</html>
